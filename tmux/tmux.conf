set -g default-terminal "tmux-256color"
set -g terminal-overrides ",*:RGB"
set -g mouse on
set -g set-clipboard on
set -g history-limit 50000
set -g extended-keys-format csi-u

# Enable reporting of modified keys (Ctrl/Alt/Shift combinations).
set -s extended-keys on
set -as terminal-features ",xterm*:extkeys"

# Vim like pane selection
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

unbind %
bind | split-window -h -c "#{pane_current_path}"

unbind '"'
bind - split-window -v -c "#{pane_current_path}"

unbind r
bind r source-file $HOME/.tmux.conf

# Change from 0 based to 1 based because keyboard layout
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Vim-like copy/paste
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
unbind -T copy-mode-vi MouseDragEnd1Pane

# Alt+hjkl to switch panes (vim-style)
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Alt+number to select window
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

bind -n S-Left previous-window
bind -n S-Right next-window

# Kanagawa Dragon theme colors (default layout, palette only)
thm_bg="#181616"
thm_fg="#c5c9c5"
thm_cyan="#8ea4a2"
thm_gray="#393836"
thm_gray3="#7a8382"
thm_red="#c4746e"
thm_blue="#8ba4b0"
thm_black4="#282727"

# Status bar: default layout; whole bar turns red while prefix is held
set -g status-style "#{?client_prefix,fg=${thm_red},fg=${thm_fg}},bg=${thm_bg}"
set -g window-status-style "fg=${thm_gray3}"
set -g window-status-current-style "fg=${thm_blue},bold"
set -g window-status-activity-style "fg=${thm_red}"

# Messages
set -g message-style "fg=${thm_cyan},bg=${thm_bg}"
set -g message-command-style "fg=${thm_cyan},bg=${thm_bg}"

# Panes
set -g pane-border-style "fg=${thm_gray}"
set -g pane-active-border-style "fg=${thm_blue}"

# Modes
set -g clock-mode-colour "${thm_blue}"
set -g mode-style "bg=${thm_black4},fg=${thm_blue}"
