set -g default-terminal "tmux-256color"
set -g terminal-overrides ",*:RGB"
set -g mouse on
set -g set-clipboard on
set -g history-limit 50000

# Vim like pane selection
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

unbind %
bind | split-window -h -c "#{pane_current_path}"

unbind '"'
bind - split-window -v -c "#{pane_current_path}"

unbind r
bind r source-file $HOME/.tmux.conf

# Change from 0 based to 1 based because keyboard layout
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Vim-like copy/paste
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
unbind -T copy-mode-vi MouseDragEnd1Pane

# Alt+hjkl to switch panes (vim-style)
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Alt+number to select window
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

bind -n S-Left previous-window
bind -n S-Right next-window

# Kanagawa Dragon theme colors
thm_bg="#181616"
thm_fg="#c5c9c5"
thm_cyan="#8ea4a2"
thm_black="#0d0c0c"
thm_gray="#393836"
thm_gray3="#7a8382"
thm_magenta="#8992a7"
thm_pink="#a292a3"
thm_red="#c4746e"
thm_green="#87a987"
thm_yellow="#c4b28a"
thm_blue="#8ba4b0"
thm_orange="#b6927b"
thm_black4="#282727"

# Status bar
set -g status "on"
set -g status-bg "${thm_bg}"
set -g status-justify "left"
set -g status-left-length "100"
set -g status-right-length "100"

# Messages
set -g message-style "fg=${thm_cyan},bg=${thm_bg},align=left"
set -g message-command-style "fg=${thm_cyan},bg=${thm_bg},align=left"
set -g prompt-cursor-colour "${thm_cyan}"
set -g prompt-cursor-style "bar"

# Panes
set -g pane-border-style "fg=${thm_gray}"
set -g pane-active-border-style "fg=${thm_blue}"

# Windows
set -g window-status-activity-style "fg=${thm_fg},bg=${thm_bg},none"
set -g window-status-separator ""
set -g window-status-style "fg=${thm_fg},bg=${thm_bg},none"

# Statusline - current window
set -g window-status-current-format "#[fg=${thm_bg},bg=${thm_blue},bold] #I #[fg=${thm_fg},bg=${thm_bg},nobold]"

# Statusline - other windows
set -g window-status-format "#[fg=${thm_gray3},bg=${thm_bg},nobold] #I #[fg=${thm_fg},bg=${thm_bg}]"

# Statusline - right side
set -g status-right "#{?client_prefix,#[fg=${thm_red}],#[fg=${thm_blue}]}#[bg=${thm_bg},nobold,nounderscore,noitalics]#{?client_prefix,#[bg=${thm_red}],#[bg=${thm_blue}]}#[fg=${thm_bg},nobold,nounderscore,noitalics] #[fg=${thm_fg},bg=${thm_gray}] #W #{?client_prefix,#[fg=${thm_red}],#[fg=${thm_blue}]}#[bg=${thm_gray}]#{?client_prefix,#[bg=${thm_red}],#[bg=${thm_blue}]}#[fg=${thm_bg}] #[fg=${thm_fg},bg=${thm_gray}] #S #{?client_prefix,#[fg=${thm_red}],#[fg=${thm_blue}]}#[bg=${thm_gray}]#{?client_prefix,#[bg=${thm_red}],#[bg=${thm_blue}]}#[fg=${thm_bg}] #[fg=${thm_fg},bg=${thm_gray}] %H:%M "

# Statusline - left side (empty)
set -g status-left ""

# Modes
set -g clock-mode-colour "${thm_blue}"
set -g mode-style "fg=${thm_blue} bg=${thm_black4} bold"
