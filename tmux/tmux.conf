set -g default-terminal "tmux-256color"
set -g terminal-overrides ",*:RGB"
set -g mouse on
set -g set-clipboard on
set -g history-limit 50000
set -as terminal-features ",xterm*:extkeys"
set -g extended-keys on

# Change from 0 based to 1 based because keyboard layout
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

# Vim-like copy/paste
set -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
unbind -T copy-mode-vi MouseDragEnd1Pane

# Split windows with current path
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Reload config
bind r source-file $HOME/.tmux.conf

# Alt+hjkl to switch panes (vim-style)
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Shift+arrow to switch windows
bind -n S-Left previous-window
bind -n S-Right next-window

# Status bar: dark bg, dim grey text; current window highlighted with light grey
set -g status-style "bg=black,fg=colour243"
set -g window-status-current-style "bg=colour236,fg=colour250,bold"
set -g window-status-current-format " #[bold]#I:#W #[default]"
set -g window-status-format " #I:#W "

# Highlight the active pane border
set -g pane-border-style "fg=colour236"
set -g pane-active-border-style "fg=colour250"
