# Terminal
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:RGB"

# Input
set -g mouse on
set -g set-clipboard on

# General behavior
set -g history-limit 10000
set -sg escape-time 0
set -g focus-events on

# Window and pane indexing
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Status line (top)
set -g status-position bottom
set -g status-bg colour236
set -g status-fg colour250
set -g status-left ''
set -g status-right '#[fg=colour250,bg=colour238,bold] %Y-%m-%d #[fg=colour255,bg=colour240,bold] %H:%M '
set -g status-right-length 50
set -g status-left-length 20

setw -g window-status-current-format '#[fg=colour255,bg=colour240,bold] #I#[fg=colour246]:#[fg=colour255]#W#[fg=colour252]#F '
setw -g window-status-format '#[fg=colour244,bg=colour236] #I#[fg=colour240]:#[fg=colour248]#W#[fg=colour242]#F '

# Reload config
bind r source-file ~/.tmux.conf \; display "Reloaded!"

# Window navigation
bind a last-window

# Pane navigation (vim keys)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Copy mode (vi)
setw -g mode-keys vi
