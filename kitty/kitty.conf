# kitty.conf — https://sw.kovidgoyal.net/kitty/conf/
# Reload: ctrl+shift+f5 (opt+cmd+f5) or restart kitty.

# --- Font ---
font_size 14.0
font_family family="Monaspace Argon" style=Regular
bold_font family="Monaspace Argon" style=SemiBold
italic_font family="Monaspace Argon" style=Italic
bold_italic_font family="Monaspace Argon" style="SemiBold Italic"
disable_ligatures always
# Line spacing: 110% of the font's natural line height
modify_font cell_height 110%
# Dedicated icon font: Monaspace Argon ships no Nerd Font glyphs
# (brew install --cask font-symbols-only-nerd-font)
symbol_map U+E000-U+F8FF Symbols Nerd Font Mono

# --- Cursor & shell ---
cursor_shape block
shell_integration no-cursor

# --- Window ---
# top right bottom left
window_padding_width 4 10 4 10

# --- Tab bar ---
tab_bar_edge top
tab_bar_style powerline
tab_powerline_style slanted

# --- macOS ---
macos_option_as_alt left
macos_titlebar_color background

# --- Bell ---
enable_audio_bell no
window_alert_on_bell no
bell_on_tab ""
visual_bell_duration 0

# --- Misc ---
confirm_os_window_close 0
scrollback_lines 10000
shell zsh

include current-theme.conf
